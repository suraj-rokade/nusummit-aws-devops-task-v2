<!DOCTYPE html>
<html>
  <head>
    <title>NuSummit AWS DevOps Project</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f2f6fc;
        margin: 0;
        padding: 0;
      }

      .container {
        margin-top: 8%;
      }

      h1 {
        color: #2e4a7d;
        font-size: 36px;
      }

      h3 {
        color: #333;
        font-weight: 400;
      }

      .success-box {
        margin: 30px auto;
        padding: 18px 25px;
        width: 60%;
        border-radius: 8px;
        background: #d4edda;
        color: #155724;
        border-left: 8px solid #28a745;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        font-size: 18px;
      }

      .footer {
        margin-top: 60px;
        color: #666;
        font-size: 14px;
      }

    </style>
  </head>

  <body>
    <div class="container">
      <h1>🚀 Welcome to NuSummit AWS DevOps Project</h1>
      <h3>Deployed via Terraform + Amazon Linux 2023 + AWS CodePipeline</h3>

      <div class="success-box">
        ✅ CI/CD Pipeline Status: <strong>SUCCESS</strong><br>
        Your recent code changes were automatically built and deployed!
      </div>

      <div class="footer">
        Powered by AWS | Infrastructure as Code | Continuous Deployment
      </div>
    </div>
  </body>
</html>
